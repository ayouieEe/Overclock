name: Context Audit

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  context-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run project context audit
        shell: pwsh
        run: ./scripts/audit-project.ps1
